<rect x="104" y="637" width="408" height="230" rx="14" fill="#4d444e"/>
<text x="136" y="690" fill="#fff" font-size="30" font-weight="700">Review the report</text>
<text x="136" y="738" fill="#d6d9e0" font-size="25">Read, communicate,</text><text x="136" y="774" fill="#d6d9e0" font-size="25">and update status</text><text x="136" y="810" fill="#d6d9e0" font-size="25">in one workspace.</text>
<g fill="#4d444e" stroke="#887b8a" stroke-width="1.5"><rect x="552" y="637" width="784" height="62" rx="10"/><rect x="552" y="721" width="784" height="62" rx="10"/><rect x="552" y="805" width="784" height="62" rx="10"/></g>
<g fill="#fff" font-size="26"><text x="580" y="677">Relevant records</text><text x="580" y="761">Attachments and submission details</text><text x="580" y="845">Related communication</text></g>
<text x="72" y="955" fill="#d6d9e0" font-size="25">Supporting information stays alongside the work it informs.</text>
