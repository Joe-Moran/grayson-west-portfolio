<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">Keeping the work with the report</title>
<desc id="desc">A conceptual comparison of switching between a report, external records and email, and reviewing those resources together in a proposed shared workspace.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="m2 2 8 4-8 4" fill="none" stroke="#f7c163" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1440" height="1020" rx="24" fill="#281f2c"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="72" y="100" fill="#f7c163" font-size="44" font-weight="700">Keeping the work with the report</text>
<text x="72" y="148" fill="#d6d9e0" font-size="25">A conceptual comparison of the existing and proposed workflows</text>
<text x="72" y="223" fill="#d6d9e0" font-size="22" font-weight="700" letter-spacing="2">BEFORE · WORK ACROSS SEPARATE TOOLS</text>
<g fill="#352c3a" stroke="#887b8a" stroke-width="1.5">
<rect x="72" y="256" width="282" height="150" rx="16"/>
<rect x="410" y="256" width="282" height="150" rx="16"/>
<rect x="748" y="256" width="282" height="150" rx="16"/>
<rect x="1086" y="256" width="282" height="150" rx="16"/>
</g>
<g fill="#fff" font-size="27" font-weight="700" text-anchor="middle">
<text x="213" y="319">Open the report</text>
<text x="551" y="319">Find records</text>
<text x="889" y="319">Check email</text>
<text x="1227" y="310">Return and</text><text x="1227" y="347">update status</text>
</g>
<g fill="#d6d9e0" font-size="23" text-anchor="middle">
<text x="213" y="362">Intake channel</text><text x="551" y="362">Other systems</text><text x="889" y="362">Separate threads</text>
</g>
<g fill="none" stroke="#f7c163" stroke-width="3" marker-end="url(#arrow)"><path d="M365 331h34"/><path d="M703 331h34"/><path d="M1041 331h34"/></g>
<text x="72" y="462" fill="#d6d9e0" font-size="25">Staff carry information and context between applications.</text>
<path d="M72 507h1296" stroke="#65586a"/>
<text x="72" y="570" fill="#f7c163" font-size="22" font-weight="700" letter-spacing="2">PROPOSED · WORK IN THE REPORT’S CONTEXT</text>
